<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mosslight - Game Boy Color</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e1a;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: 'Courier New', monospace;
  }
  #game-container {
    width: 100vw; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #game {
    width: 100%; height: 100%;
    max-width: 100%; max-height: 100%;
  }
  #title-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0a0e1a; z-index: 10;
  }
  #title-overlay h1 {
    color: #5fe3d4; font-size: 36px; letter-spacing: 10px;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(95,227,212,0.3);
  }
  #title-overlay .subtitle {
    color: #8a8aaa; font-size: 13px; margin-bottom: 30px;
  }
  #start-btn {
    padding: 14px 36px;
    background: #1a3a2a; border: 2px solid #5fe3d4;
    border-radius: 8px; color: #5fe3d4;
    font-size: 16px; cursor: pointer;
    transition: all 0.2s;
  }
  #start-btn:hover { background: #2a5a3a; box-shadow: 0 0 20px rgba(95,227,212,0.2); }
  #status {
    color: #5fe3d4; font-size: 13px; text-align: center;
    padding: 10px; display: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="game"></div>
  <div id="title-overlay">
    <h1>MOSSLIGHT</h1>
    <div class="subtitle">A Game Boy Color wildlife garden game</div>
    <button id="start-btn">Press Start</button>
    <div id="status">Loading emulator...</div>
  </div>
</div>
<script>
/*
 * Mosslight - Game Boy Color ROM web player
 *
 * Uses EmulatorJS (a WASM-based RetroArch frontend) to run the
 * compiled GBC ROM in the browser. The ROM itself is a real
 * Game Boy Color binary built with GBDK-2020.
 *
 * Controls:
 *   Arrow Keys     - Move
 *   J / Z          - A button (interact, confirm)
 *   K / X          - B button (use tool, cancel)
 *   Enter          - Start (menu)
 *   Shift / Tab    - Select (field guide)
 */
(function() {
  const overlay = document.getElementById('title-overlay');
  const startBtn = document.getElementById('start-btn');
  const status = document.getElementById('status');
  let started = false;

  startBtn.addEventListener('click', () => {
    if (started) return;
    started = true;
    overlay.style.display = 'none';

    // EmulatorJS configuration
    EJS_player        = '#game';
    EJS_core          = 'gb';       // Game Boy / Game Boy Color core
    EJS_gameUrl       = 'mosslight.gb';
    EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;
    EJS_color         = '#5fe3d4';
    EJS_backgroundColor = '#0a0e1a';
    EJS_alignStartButton = 'center';

    // Load the EmulatorJS loader script
    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    script.onerror = () => {
      status.style.display = 'block';
      status.textContent = 'Could not load emulator. Check your internet connection.';
    };
    document.body.appendChild(script);
  });

  // Allow Enter to start
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !started) {
      startBtn.click();
    }
  });
})();
</script>
</body>
</html>
